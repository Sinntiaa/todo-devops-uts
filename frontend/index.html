<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do DevOps</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;padding:0 16px}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;padding:8px}
  li{display:flex;align-items:center;gap:8px;padding:6px 0}
  li span{flex:1} .done{text-decoration:line-through;color:#888}
  small{color:#666}
</style>
</head>
<body>
<h2>To-Do List</h2>
<form id="f"><input type="text" id="t" placeholder="Tulis tugas..." required><button>Tambah</button></form>
<ul id="list" style="list-style:none;padding:0"></ul>
<small id="info"></small>
<script>
const list = document.getElementById('list');
async function load() {
  const todos = await (await fetch('/api/todos')).json();
  list.innerHTML = '';
  todos.forEach(t => {
    const li = document.createElement('li');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = t.done;
    cb.onchange = async () => { await fetch('/api/todos/' + t.id, {method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:cb.checked})}); load(); };
    const sp = document.createElement('span'); sp.textContent = t.title; if (t.done) sp.className = 'done';
    const del = document.createElement('button'); del.textContent = 'Hapus';
    del.onclick = async () => { await fetch('/api/todos/' + t.id, {method:'DELETE'}); load(); };
    li.append(cb, sp, del); list.appendChild(li);
  });
  const info = await (await fetch('/api/info')).json();
  document.getElementById('info').textContent = 'Dilayani backend container: ' + info.host;
}
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const t = document.getElementById('t');
  await fetch('/api/todos', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t.value})});
  t.value = ''; load();
};
load();
</script>
</body>
</html>
